<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <radialGradient id="solvationShell" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#b7e4c7" stop-opacity="0"/>
      <stop offset="90%" stop-color="#52b788" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="500" height="300" fill="#fffef9" rx="8" stroke="#d8d4c8" stroke-width="1.5"/>

  <!-- Left: Unfolded/Denatured in Pure Water -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="180" height="190" rx="4" fill="#f5f2eb" stroke="#d8d4c8" stroke-width="1"/>
    <text x="90" y="-12" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#1a1a18">Aqueous / Thermal Stress</text>
    <!-- Denatured chain -->
    <path d="M 30 140 Q 60 40 90 120 T 150 70" fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="170" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#8a8a7a">Unfolded / Aggregation-Prone</text>
  </g>

  <!-- Arrow with DES label -->
  <g transform="translate(220, 125)">
    <polygon points="10,5 50,5 50,0 60,10 50,20 50,15 10,15" fill="#2d6a4f"/>
    <text x="35" y="-6" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#2d6a4f">+ DES</text>
    <text x="35" y="32" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#8a8a7a">HBD : HBA Network</text>
  </g>

  <!-- Right: Folded & Stabilized Protein -->
  <g transform="translate(290, 40)">
    <rect x="0" y="0" width="180" height="190" rx="4" fill="#f5f2eb" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="90" y="-12" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#2d6a4f">DES Solvation Shield</text>
    
    <!-- Protective solvation layer -->
    <circle cx="90" cy="95" r="55" fill="url(#solvationShell)"/>
    
    <!-- Folded secondary structures (helices / sheets) -->
    <!-- Alpha Helix Representation -->
    <path d="M 65 95 C 65 75, 80 75, 80 95 C 80 115, 95 115, 95 95 C 95 75, 110 75, 110 95" fill="none" stroke="#2d6a4f" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- DES Network particles around protein -->
    <!-- Choline cations -->
    <circle cx="45" cy="55" r="4" fill="#c9a84c"/>
    <circle cx="135" cy="135" r="4" fill="#c9a84c"/>
    <!-- Urea / Glycerol molecules -->
    <circle cx="130" cy="55" r="3" fill="#52b788"/>
    <circle cx="50" cy="130" r="3" fill="#52b788"/>
    <!-- Hydrogen bonds (dashed lines) -->
    <line x1="45" y1="55" x2="65" y2="75" stroke="#8a8a7a" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="130" y1="55" x2="110" y2="75" stroke="#8a8a7a" stroke-width="1" stroke-dasharray="2 2"/>
    
    <text x="90" y="170" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#2d6a4f">Native Compact State</text>
  </g>

  <!-- Footer Tag -->
  <text x="250" y="275" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#4a4a42">Preferential Exclusion &amp; Hydrogen-Bond Network Confinement</text>
</svg>
