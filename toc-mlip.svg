<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <rect width="500" height="300" fill="#fffef9" rx="8" stroke="#d8d4c8" stroke-width="1.5"/>

  <!-- Left: Atomic Environment / Coordinates -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="100" height="190" rx="4" fill="#f5f2eb" stroke="#d8d4c8" stroke-width="1"/>
    <text x="50" y="-12" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#1a1a18">Atomic Config</text>
    
    <!-- Central atom & neighbors -->
    <circle cx="50" cy="95" r="9" fill="#2d6a4f"/>
    <circle cx="28" cy="65" r="6" fill="#52b788"/>
    <circle cx="72" cy="70" r="6" fill="#52b788"/>
    <circle cx="32" cy="125" r="6" fill="#c9a84c"/>
    <circle cx="68" cy="130" r="6" fill="#c9a84c"/>
    <!-- Distances/descriptors -->
    <line x1="50" y1="95" x2="28" y2="65" stroke="#8a8a7a" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="50" y1="95" x2="72" y2="70" stroke="#8a8a7a" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="50" y1="95" x2="32" y2="125" stroke="#8a8a7a" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="50" y1="95" x2="68" y2="130" stroke="#8a8a7a" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="50" y="170" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#8a8a7a">{R_ij, Z_i}</text>
  </g>

  <!-- Middle: Neural Network Graph -->
  <g transform="translate(160, 45)">
    <rect x="0" y="0" width="150" height="190" rx="4" fill="#f5f2eb" stroke="#2d6a4f" stroke-width="1.2"/>
    <text x="75" y="-12" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#2d6a4f">GNN / E(n)-Equivariant</text>
    
    <!-- Input layer nodes -->
    <circle cx="25" cy="60" r="5" fill="#2d6a4f"/>
    <circle cx="25" cy="95" r="5" fill="#2d6a4f"/>
    <circle cx="25" cy="130" r="5" fill="#2d6a4f"/>
    
    <!-- Hidden layer nodes -->
    <circle cx="75" cy="50" r="5" fill="#52b788"/>
    <circle cx="75" cy="80" r="5" fill="#52b788"/>
    <circle cx="75" cy="110" r="5" fill="#52b788"/>
    <circle cx="75" cy="140" r="5" fill="#52b788"/>
    
    <!-- Output layer node -->
    <circle cx="125" cy="95" r="6" fill="#c9a84c"/>

    <!-- Network connections -->
    <line x1="25" y1="60" x2="75" y2="50" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="25" y1="60" x2="75" y2="80" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="25" y1="95" x2="75" y2="80" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="25" y1="95" x2="75" y2="110" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="25" y1="130" x2="75" y2="110" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="25" y1="130" x2="75" y2="140" stroke="#b7e4c7" stroke-width="1"/>
    
    <line x1="75" y1="50" x2="125" y2="95" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="75" y1="80" x2="125" y2="95" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="75" y1="110" x2="125" y2="95" stroke="#b7e4c7" stroke-width="1"/>
    <line x1="75" y1="140" x2="125" y2="95" stroke="#b7e4c7" stroke-width="1"/>
    
    <text x="75" y="170" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#2d6a4f">Message Passing</text>
  </g>

  <!-- Right: Potential Energy Surface / Outputs -->
  <g transform="translate(340, 45)">
    <rect x="0" y="0" width="130" height="190" rx="4" fill="#f5f2eb" stroke="#d8d4c8" stroke-width="1"/>
    <text x="65" y="-12" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#1a1a18">DFT Accuracy</text>
    
    <!-- PES curve -->
    <path d="M 20 60 Q 45 150 75 110 T 110 70" fill="none" stroke="#2d6a4f" stroke-width="2.5"/>
    <circle cx="60" cy="120" r="4" fill="#c9a84c"/>
    
    <text x="65" y="145" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#1a1a18">Energy &amp; Forces</text>
    <text x="65" y="170" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#52b788">MD: ns → μs scale</text>
  </g>

  <!-- Footer Tag -->
  <text x="250" y="275" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#4a4a42">Quantum Accuracy at Classical Molecular Dynamics Speeds</text>
</svg>
